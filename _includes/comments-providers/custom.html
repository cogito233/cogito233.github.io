<!-- start custom comments snippet: giscus (GitHub Discussions) -->
{% if site.comments.giscus.repo_id and site.comments.giscus.category_id %}
<script src="https://giscus.app/client.js"
        data-repo="{{ site.repository }}"
        data-repo-id="{{ site.comments.giscus.repo_id }}"
        data-category="{{ site.comments.giscus.category | default: 'Blog comments' }}"
        data-category-id="{{ site.comments.giscus.category_id }}"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="light"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
{% endif %}
<!-- end custom comments snippet -->
