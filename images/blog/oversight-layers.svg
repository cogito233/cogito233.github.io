<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One person oversees many agents through a middle layer. Top: the human sees one screen (charter, budget, threads) and acts at two points: approve a task, accept a result. Middle: planner plus task files in the repo, four task cards each with TASK, LOG and RESULT files; rebuilt from files, any agent can be replaced. Bottom: many short-lived agents under each task, some running, some exited; they come and go, no polling. The human never watches agents directly.">
<title>One screen, a middle layer, many agents</title>
<defs>
<marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B4530A"/></marker>
<marker id="a-planner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F5FBF"/></marker>
<marker id="a-worker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B7F5C"/></marker>
<marker id="a-thin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B7F5C"/></marker>
</defs>

<!-- background -->
<rect x="1" y="1" width="758" height="438" rx="16" fill="#F7F7F5" stroke="#D9DBD6" stroke-width="2"/>

<!-- ===== TIER 1: YOU ===== -->
<rect x="16" y="16" width="698" height="108" rx="12" fill="#B4530A" fill-opacity="0.06"/>
<text x="28" y="40" font-size="18" font-weight="bold" fill="#B4530A">You<tspan font-size="14" font-weight="normal" fill="#5C6670"> · one person, one screen</tspan></text>

<!-- one screen panel -->
<rect x="28" y="50" width="340" height="66" rx="10" fill="#FFFFFF" stroke="#B4530A" stroke-width="2"/>
<text x="40" y="71" font-size="14" fill="#5C6670"><tspan font-weight="bold" fill="#1F2933">Charter</tspan> · question + hypothesis</text>
<text x="40" y="90" font-size="14" fill="#5C6670"><tspan font-weight="bold" fill="#1F2933">Budget</tspan> · GPU-h / $ per thread</text>
<text x="40" y="109" font-size="14" fill="#5C6670"><tspan font-weight="bold" fill="#1F2933">Threads</tspan> · stage + evidence</text>

<!-- two action tags -->
<rect x="400" y="54" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="2"/>
<text x="480" y="73" font-size="15" font-weight="bold" fill="#B4530A" text-anchor="middle">① approve a task</text>
<rect x="400" y="88" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="2"/>
<text x="480" y="107" font-size="15" font-weight="bold" fill="#B4530A" text-anchor="middle">② accept a result</text>

<!-- thick two-way arrow You <-> Middle -->
<path d="M200 128 L200 162" fill="none" stroke="#B4530A" stroke-width="3" marker-start="url(#a-human)" marker-end="url(#a-human)"/>
<text x="212" y="150" font-size="14" fill="#5C6670">reads one screen ↓ / decisions ↑</text>

<!-- ===== TIER 2: MIDDLE LAYER ===== -->
<rect x="16" y="166" width="698" height="118" rx="12" fill="#1F5FBF" fill-opacity="0.06"/>
<text x="28" y="188" font-size="18" font-weight="bold" fill="#1F5FBF">Middle layer<tspan font-size="14" font-weight="normal" fill="#5C6670"> · planner + task files in the repo</tspan></text>
<text x="702" y="188" font-size="14" font-style="italic" fill="#5C6670" text-anchor="end">rebuilt from files; any agent can be replaced</text>

<!-- task cards -->
<rect x="28" y="198" width="160" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2"/>
<text x="40" y="222" font-size="15" font-weight="bold" fill="#1F5FBF">T1 build</text>
<rect x="38" y="236" width="140" height="24" rx="6" fill="#1F5FBF" fill-opacity="0.08"/>
<text x="108" y="253" font-size="14" fill="#1F5FBF" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">TASK · LOG · RESULT</text>

<rect x="199" y="198" width="160" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2"/>
<text x="211" y="222" font-size="15" font-weight="bold" fill="#1F5FBF">T2 experiment</text>
<rect x="209" y="236" width="140" height="24" rx="6" fill="#1F5FBF" fill-opacity="0.08"/>
<text x="279" y="253" font-size="14" fill="#1F5FBF" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">TASK · LOG · RESULT</text>

<rect x="370" y="198" width="160" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2"/>
<text x="382" y="222" font-size="15" font-weight="bold" fill="#1F5FBF">T3 review</text>
<rect x="380" y="236" width="140" height="24" rx="6" fill="#1F5FBF" fill-opacity="0.08"/>
<text x="450" y="253" font-size="14" fill="#1F5FBF" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">TASK · LOG · RESULT</text>

<rect x="541" y="198" width="160" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2"/>
<text x="553" y="222" font-size="15" font-weight="bold" fill="#1F5FBF">T4 reading</text>
<rect x="551" y="236" width="140" height="24" rx="6" fill="#1F5FBF" fill-opacity="0.08"/>
<text x="621" y="253" font-size="14" fill="#1F5FBF" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">TASK · LOG · RESULT</text>

<!-- thin arrows Middle <-> Agents (4 per task) -->
<g fill="none" stroke="#1B7F5C" stroke-width="1.5" stroke-opacity="0.8">
<path d="M50 276 L50 312" marker-end="url(#a-thin)"/>
<path d="M80 316 L80 280" marker-end="url(#a-thin)"/>
<path d="M136 276 L136 312" marker-end="url(#a-thin)"/>
<path d="M166 316 L166 280" marker-end="url(#a-thin)"/>

<path d="M221 276 L221 312" marker-end="url(#a-thin)"/>
<path d="M251 316 L251 280" marker-end="url(#a-thin)"/>
<path d="M307 276 L307 312" marker-end="url(#a-thin)"/>
<path d="M337 316 L337 280" marker-end="url(#a-thin)"/>

<path d="M392 276 L392 312" marker-end="url(#a-thin)"/>
<path d="M422 316 L422 280" marker-end="url(#a-thin)"/>
<path d="M478 276 L478 312" marker-end="url(#a-thin)"/>
<path d="M508 316 L508 280" marker-end="url(#a-thin)"/>

<path d="M563 276 L563 312" marker-end="url(#a-thin)"/>
<path d="M593 316 L593 280" marker-end="url(#a-thin)"/>
<path d="M649 276 L649 312" marker-end="url(#a-thin)"/>
<path d="M679 316 L679 280" marker-end="url(#a-thin)"/>
</g>

<!-- ===== TIER 3: AGENTS ===== -->
<rect x="16" y="316" width="698" height="106" rx="12" fill="#1B7F5C" fill-opacity="0.06"/>
<text x="28" y="338" font-size="18" font-weight="bold" fill="#1B7F5C">Agents<tspan font-size="14" font-weight="normal" fill="#5C6670"> · come and go; no polling</tspan></text>

<!-- group T1 -->
<rect x="28" y="350" width="74" height="26" rx="13" fill="#1B7F5C"/>
<text x="65" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent</text>
<g opacity="0.55">
<rect x="114" y="350" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#1B7F5C" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="151" y="368" font-size="14" fill="#1B7F5C" text-anchor="middle">exited</text>
</g>
<rect x="28" y="382" width="74" height="26" rx="13" fill="#1B7F5C"/>
<text x="65" y="400" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent</text>

<!-- group T2 -->
<rect x="199" y="350" width="74" height="26" rx="13" fill="#1B7F5C"/>
<text x="236" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent</text>
<rect x="285" y="350" width="74" height="26" rx="13" fill="#1B7F5C"/>
<text x="322" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent</text>
<g opacity="0.55">
<rect x="285" y="382" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#1B7F5C" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="322" y="400" font-size="14" fill="#1B7F5C" text-anchor="middle">exited</text>
</g>

<!-- group T3 -->
<g opacity="0.55">
<rect x="370" y="350" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#1B7F5C" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="407" y="368" font-size="14" fill="#1B7F5C" text-anchor="middle">exited</text>
</g>
<rect x="456" y="350" width="74" height="26" rx="13" fill="#1B7F5C"/>
<text x="493" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent</text>

<!-- group T4 -->
<rect x="541" y="350" width="74" height="26" rx="13" fill="#1B7F5C"/>
<text x="578" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent</text>
<g opacity="0.55">
<rect x="627" y="350" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#1B7F5C" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="664" y="368" font-size="14" fill="#1B7F5C" text-anchor="middle">exited</text>
<rect x="541" y="382" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#1B7F5C" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="578" y="400" font-size="14" fill="#1B7F5C" text-anchor="middle">exited</text>
</g>

<!-- ===== NO direct link You -> Agents (bypass, crossed out) ===== -->
<path d="M714 70 L732 70 L732 370 L714 370" fill="none" stroke="#5C6670" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6 5"/>
<path d="M725 213 L739 227 M739 213 L725 227" fill="none" stroke="#B4530A" stroke-width="3"/>
<text x="755" y="220" font-size="14" fill="#5C6670" text-anchor="middle" transform="rotate(-90 755 220)">not watched directly</text>
</svg>
